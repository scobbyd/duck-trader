# Duck Trader — Home Assistant package (reference wiring)
#
# Drop into packages/ (needs `homeassistant: packages: !include_dir_named
# packages` or equivalent). Replace every PLACEHOLDER entity with your own.
# The solver itself runs outside HA (see solve_and_push.py); this package
# holds the master switch, the plan readout, the executor, the reactive
# guards, and the 30-minute re-solve check with a deadband.

input_boolean:
  duck_trader_enabled:
    name: Duck Trader enabled
    icon: mdi:duck
    # no initial: — survives restarts with its last state

input_number:
  duck_trader_deadband_kwh:
    name: Duck Trader re-solve deadband
    # measured on the reference site: 4 kWh keeps the insurance value
    # with the fewest re-solves; tighter deadbands only add churn
    min: 0.5
    max: 8
    step: 0.5
    unit_of_measurement: kWh

# The external solver posts sensor.duck_trader_plan (state = generated_at,
# attributes.plan = list of {t, c_kw, d_kw, soc_kwh, export_ok}). These
# templates expose the CURRENT step's setpoints.
template:
  - sensor:
      - name: duck_trader_charge_setpoint
        unit_of_measurement: kW
        state: >
          {% set ns = namespace(v=0.0) %}
          {% for row in state_attr('sensor.duck_trader_plan', 'plan') or [] %}
            {% if as_datetime(row.t) <= now() %}{% set ns.v = row.c_kw %}{% endif %}
          {% endfor %}
          {{ ns.v }}
      - name: duck_trader_discharge_setpoint
        unit_of_measurement: kW
        state: >
          {% set ns = namespace(v=0.0) %}
          {% for row in state_attr('sensor.duck_trader_plan', 'plan') or [] %}
            {% if as_datetime(row.t) <= now() %}{% set ns.v = row.d_kw %}{% endif %}
          {% endfor %}
          {{ ns.v }}
      - name: duck_trader_planned_soc
        unit_of_measurement: kWh
        state: >
          {% set ns = namespace(v=none) %}
          {% for row in state_attr('sensor.duck_trader_plan', 'plan') or [] %}
            {% if as_datetime(row.t) <= now() %}{% set ns.v = row.soc_kwh %}{% endif %}
          {% endfor %}
          {{ ns.v if ns.v is not none else 0 }}
  - binary_sensor:
      - name: duck_trader_export_ok
        state: >
          {% set ns = namespace(v=true) %}
          {% for row in state_attr('sensor.duck_trader_plan', 'plan') or [] %}
            {% if as_datetime(row.t) <= now() %}{% set ns.v = row.export_ok %}{% endif %}
          {% endfor %}
          {{ ns.v }}

# How the solver gets (re)triggered from HA. Point it at wherever
# solve_and_push.py lives; a rest_command to a tiny webhook wrapper works
# equally well if the solver runs on another host.
shell_command:
  duck_trader_solve: /usr/bin/env HA_URL=... HA_TOKEN=... python3 /path/to/duck-trader/ha/solve_and_push.py

automation:
  # 1. Daily plan, minutes after the day-ahead auction publishes D+1.
  - alias: "Duck Trader: daily solve"
    trigger:
      - platform: time
        at: "13:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.duck_trader_enabled
        state: "on"
    action:
      - action: shell_command.duck_trader_solve

  # 2. Re-solve check every 30 minutes, with a deadband: only when actual
  #    SOC has drifted from the plan's expectation (PV misses, unplanned
  #    loads). PLACEHOLDER: sensor.battery_soc_kwh = your SOC in kWh
  #    (SOC % x capacity works fine as a template sensor).
  - alias: "Duck Trader: re-solve on drift"
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.duck_trader_enabled
        state: "on"
      - condition: template
        value_template: >
          {{ (states('sensor.battery_soc_kwh') | float(0)
              - states('sensor.duck_trader_planned_soc') | float(0)) | abs
             > states('input_number.duck_trader_deadband_kwh') | float(4) }}
    action:
      - action: shell_command.duck_trader_solve

  # 3. Executor: push the current setpoints to the inverter each step.
  #    THIS PART IS HARDWARE-SPECIFIC. For Deye-family hybrids via the
  #    Solarman integration the usual levers are the time-of-use points
  #    (number.*_time_point_N_soc + charge enable switches) or a direct
  #    work-mode/power register; map the two setpoints onto whatever your
  #    integration exposes, idempotently. The skeleton below only shows
  #    the shape; it deliberately writes nothing as shipped.
  - alias: "Duck Trader: executor"
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: state
        entity_id: input_boolean.duck_trader_enabled
        state: "on"
    action:
      - variables:
          charge_kw: "{{ states('sensor.duck_trader_charge_setpoint') | float(0) }}"
          discharge_kw: "{{ states('sensor.duck_trader_discharge_setpoint') | float(0) }}"
      # - action: number.set_value          # PLACEHOLDER example
      #   target:
      #     entity_id: number.inverter_max_charge_current
      #   data:
      #     value: "{{ (charge_kw * 1000 / 51.2) | round(0) }}"
      - action: persistent_notification.create
        data:
          notification_id: duck_trader_executor
          title: Duck Trader setpoints
          message: >
            charge {{ charge_kw }} kW, discharge {{ discharge_kw }} kW —
            wire these to your inverter and delete this notification action.

  # 4. Guard: never export at negative sell prices. PLACEHOLDER:
  #    number.inverter_export_limit_w or your integration's equivalent.
  - alias: "Duck Trader: block export at negative prices"
    trigger:
      - platform: state
        entity_id: binary_sensor.duck_trader_export_ok
    condition:
      - condition: state
        entity_id: input_boolean.duck_trader_enabled
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.duck_trader_export_ok
                state: "off"
            sequence: []   # PLACEHOLDER: set export limit to ~0 W
        default: []        # PLACEHOLDER: restore normal export limit
